<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netflix Login</title>
<link rel="stylesheet" href="login.css">
</head>
<body>
   <div class="logo-wrap"><img src="Items/logo.svg" alt="Netflix"></div>
   <div class="line"></div>
   <div class="container-wrap">
       <div class="container">
            <h1>Enter your info to sign in</h1>
            <p class="subtext">Or get started with a new account.</p>
            <input type="text" placeholder="Email or mobile number">
            <button>Continue</button>
            <div class="help">
                Get Help
                <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                    <path d="M6 9l6 6 6-6"/>
                </svg>
            </div>
            <p class="recaptcha">This page is protected by Google reCAPTCHA to ensure you're not a bot.</p>
        </div>
   </div>

   <div class="login-footer">
       <div class="login-footer-inner">
           <p class="login-footer-contact">Questions? <a href="javascript:void(0)">Contact us</a>.</p>
           <div class="login-footer-links">
               <a href="javascript:void(0)">FAQ</a>
               <a href="javascript:void(0)">Help Center</a>
               <a href="javascript:void(0)">Terms of Use</a>
               <a href="javascript:void(0)">Privacy</a>
               <a href="javascript:void(0)">Cookie Preferences</a>
               <a href="javascript:void(0)">Corporate Information</a>
           </div>
       </div>
   </div>
</body>
</html>
